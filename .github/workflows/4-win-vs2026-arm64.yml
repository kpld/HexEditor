name: win-VS2026-build (arm64)

# 只手动触发：Actions 页面左侧点这个 → Run workflow，只跑本平台。
on:
  workflow_dispatch:
  # TEMP(verify): push 触发仅用于本次 8 平台验证，验证完成后移除，恢复纯手动。
  push:
    branches: [main]
    paths:
      - '.github/workflows/4-win-vs2026-arm64.yml'
      - 'src/**'
      - 'uires/**'
      - 'CMakeLists.txt'
      - 'patches/**'

jobs:
  build:
    # 专用镜像：VS2026 工具链的原生 ARM64 runner（只装 VS2026）。
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned SOUI + apply patches
        shell: bash
        run: |
          set -e
          exec > >(tee -a soui-fetch.log) 2>&1
          rm -rf soui4
          git init soui4
          git -C soui4 config core.autocrlf false
          git -C soui4 remote add origin https://github.com/soui4/soui.git
          git -C soui4 fetch --depth 1 origin 8a96e0745cdb7a01cecb8e26e00321b5f3a48c46
          git -C soui4 checkout FETCH_HEAD
          git -C soui4 config url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx.git"
          ok=0; for i in 1 2 3; do if git -C soui4 -c core.autocrlf=false -c url."https://github.com/soui4/swinx".insteadOf="https://gitee.com/setoutsoft/swinx.git" submodule update --init swinx; then ok=1; break; fi; sleep 5; done; [ "$ok" = 1 ]
          sed -i 's/\r$//' patches/soui4-8a96e07-local.patch patches/swinx-992753b-local.patch
          git -C soui4 apply ../patches/soui4-8a96e07-local.patch
          git -C soui4/swinx apply ../../patches/swinx-992753b-local.patch

      - name: Setup MSVC (VS2026)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64              # arm64 host 用 arm64，不是 amd64_arm64
          # 同 x86_64 版：不要写 vsversion: '2026'，镜像只有 VS2026，省略自动选中。

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # 只构建主程序，不碰默认 ALL target —— tools/test_model.cpp 有已知编译错误。
          cmake --build build --target HexEditor -j3 2>&1 | tee -a build.log
          cmake --build build --target resprovider-zip msftedit translator log4z -j3 2>&1 | tee -a build.log || true

      - name: Inspect
        shell: bash
        run: |
          echo "--- win VS2026 arm64 ---"
          cl.exe /Bv 2>&1 | head -8 || true
          ls -lh build/bin/ | head -25

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HexEditor-win-vs2026-arm64
          path: build/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Surface logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f build.log ]; then
            { grep -inE 'error|fatal|failed|undefined reference|not found|no such' build.log | head -40; echo '--- build.log tail ---'; tail -15 build.log; } | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do echo "::error::$line"; done
          fi
          if [ -f soui-fetch.log ]; then
            { grep -inE 'error|fatal|failed|not found|no such' soui-fetch.log | head -8; echo '--- fetch tail ---'; tail -5 soui-fetch.log; } | sed -e 's/%/%25/g' -e 's/\r//g' | while IFS= read -r line; do echo "::error::$line"; done
          fi
          true
