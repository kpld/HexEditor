<svg xmlns="http://www.w3.org/2000/svg" width="51" height="17" viewBox="0 0 51 17">
  <!-- 三个状态：勾选 / 未选中圆环 / 选中圆点。
       全部用 path 绘制：SVG 解码器对 <circle> 支持不稳，之前用 circle 时
       整张图解码失败，深色主题下勾选标记完全不显示。 -->
  <g transform="translate(0, 0)">
    <path d="M4,8 L7,11 L12,5" stroke="#89D185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <g transform="translate(17, 0)">
    <path d="M2,8 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0" fill="none" stroke="#9A9A9A" stroke-width="1.5"/>
  </g>
  <g transform="translate(34, 0)">
    <path d="M2,8 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0" fill="none" stroke="#89D185" stroke-width="1.5"/>
    <path d="M5,8 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0" fill="#89D185"/>
  </g>
</svg>
